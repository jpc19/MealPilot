<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.json">
<title>MealPilot</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#171717;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--green:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:82px}
header{padding:18px 18px 8px;position:sticky;top:0;background:rgba(245,245,247,.94);backdrop-filter:blur(12px);z-index:5}
h1{font-size:28px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px}
main{padding:10px 16px;max-width:760px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #00000008}
button,select,input{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;font-weight:650;background:#111827;color:white}
button.secondary{background:#eef0f3;color:#111827}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap}
.recipe h3{margin:0 0 4px}.meta{color:var(--muted);font-size:13px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{font-size:11px;padding:5px 8px;background:#f0f1f3;border-radius:99px}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#111827}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{background:transparent;color:#6b7280;padding:7px 8px;font-size:11px}.navactive{color:#111827!important}
.meal{display:flex;justify-content:space-between;gap:10px;align-items:center}.meal strong{display:block}.meal small{color:var(--muted)}
input[type=checkbox]{width:20px;height:20px}.listitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
dialog{border:0;border-radius:20px;width:min(92%,560px);padding:0;box-shadow:0 20px 70px #0005}dialog::backdrop{background:#0008}.modal{padding:20px}
select,input[type=number],input[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:white}
label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}
.notice{background:#f0fdf4;border:1px solid #bbf7d0;padding:12px;border-radius:12px;color:#166534;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
</style>
</head>
<body>
<header><h1>MealPilot</h1><div class="sub">Your weekly meals, planned automatically.</div></header>
<main id="app"></main>
<nav>
<button id="nplan" onclick="show('plan')">📅<br>Plan</button>
<button id="nrecipes" onclick="show('recipes')">🍳<br>Recipes</button>
<button id="nshop" onclick="show('shop')">🛒<br>Shop</button>
<button id="npantry" onclick="show('pantry')">🥫<br>Pantry</button>
<button id="nprofile" onclick="show('profile')">⚙️<br>Profile</button>
</nav>
<dialog id="swapDlg"><div class="modal"><h2>Swap meal</h2><div id="swapList"></div><button class="secondary" onclick="swapDlg.close()">Cancel</button></div></dialog>

{id:37,name:"Peanut Butter Banana Oatmeal",time:10,cal:420,p:16,c:62,f:15,diets:["standard","vegetarian"],cuisine:"American",tags:["quick","breakfast"],ingredients:{oats:"2 cups",bananas:"3",peanut_butter:"1/2 cup",milk:"2 cups",cinnamon:"1 tbsp"}},
{id:38,name:"Avocado Egg Toast",time:15,cal:410,p:20,c:37,f:21,diets:["standard","vegetarian"],cuisine:"American",tags:["quick","breakfast"],ingredients:{eggs:"6",bread:"1 loaf",avocado:"2",lemon:"1",everything_bagel_seasoning:"1 jar"}},
{id:39,name:"Berry Greek Yogurt Bowls",time:10,cal:350,p:24,c:42,f:10,diets:["standard","vegetarian"],cuisine:"Greek",tags:["quick","breakfast"],ingredients:{greek_yogurt:"3 cups",berries:"1 pint",granola:"1 bag",honey:"2 tbsp",banana:"2"}},
{id:40,name:"Breakfast Burritos",time:25,cal:520,p:31,c:52,f:21,diets:["standard","vegetarian"],cuisine:"Mexican",tags:["breakfast"],ingredients:{eggs:"8",black_beans:"1 can",tortillas:"8",cheddar:"1/2 lb",potatoes:"1.5 lb",salsa:"1 jar"}}
];
let state=JSON.parse(localStorage.getItem("mealpilot3")||"null")||{plan:[],pantry:[],favorites:[],settings:{diet:"standard",maxTime:30,meals:5,minProtein:0,servings:2,calMax:0,cuisines:"",dislikes:"",allergies:""}};
function save(){localStorage.setItem("mealpilot3",JSON.stringify(state))}
function filtered(){
 let s=state.settings, dislikes=(s.dislikes||"").toLowerCase().split(",").map(x=>x.trim()).filter(Boolean), allergies=(s.allergies||"").toLowerCase().split(",").map(x=>x.trim()).filter(Boolean), cuisines=(s.cuisines||"").toLowerCase().split(",").map(x=>x.trim()).filter(Boolean);
 return recipes.filter(r=>{
  if(s.diet!=="standard"&&!r.diets.includes(s.diet))return false;
  if(r.time>s.maxTime||r.p<s.minProtein)return false;
  if(s.calMax>0&&r.cal>s.calMax)return false;
  if(cuisines.length&&!cuisines.includes(r.cuisine.toLowerCase()))return false;
  let ing=Object.keys(r.ingredients).join(" ").toLowerCase(), name=r.name.toLowerCase();
  if(dislikes.some(x=>ing.includes(x)||name.includes(x)))return false;
  if(allergies.some(x=>ing.includes(x)||name.includes(x)))return false;
  return true;
 })
}
function generate(){
 let pool=filtered();if(pool.length<state.settings.meals){alert("Not enough recipes match your filters. Try relaxing one preference.");return}
 let used=new Set(),out=[],recent=state.plan.map(x=>x.id),pantry=new Set(state.pantry.map(x=>x.toLowerCase().replaceAll(" ","_")));
 for(let i=0;i<state.settings.meals;i++){
  let selected=new Set(out.flatMap(r=>Object.keys(r.ingredients)));
  let candidates=pool.filter(r=>!used.has(r.id));
  candidates.sort((a,b)=>scorePlan(b,selected,pantry,recent)-scorePlan(a,selected,pantry,recent));
  let top=candidates.slice(0,Math.min(5,candidates.length));
  let pick=top[Math.floor(Math.random()*top.length)];used.add(pick.id);out.push(pick);
 }
 state.plan=out;save();show("plan")
}
function scorePlan(r,selected,pantry,recent){
 return Object.keys(r.ingredients).filter(x=>selected.has(x)).length*5+
        Object.keys(r.ingredients).filter(x=>pantry.has(x)).length*3+
        (recent.includes(r.id)?-6:0)+(r.p>=state.settings.minProtein?2:0)
}
function score(r,ing){return Object.keys(r.ingredients).filter(x=>ing.has(x)).length}
function planView(){
 let p=state.plan;return `<h2>This Week</h2>
 <div class="card"><div class="row"><div><b>${p.length||0} meals planned</b><div class="meta">${state.settings.servings} servings each</div></div><button onclick="generate()">Generate My Week</button></div>${p.length?`<div class="meta" style="margin-top:12px">Average: ${Math.round(p.reduce((a,r)=>a+r.cal,0)/p.length)} cal · ${Math.round(p.reduce((a,r)=>a+r.p,0)/p.length)}g protein</div>`:""}</div>
 ${p.length?p.map((r,i)=>`<div class="card meal"><div><small>${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i]}</small><strong>${r.name}</strong><small>${r.time} min · ${r.cal} cal · ${r.p}g protein</small></div><button class="secondary" onclick="openSwap(${i})">Swap</button></div>`).join(""):`<div class="card empty">No plan yet.<br>Tap <b>Generate My Week</b> to build one.</div>`}
 ${p.length?`<div class="card"><div class="actions"><button onclick="show('shop')">View Grocery List</button><button class="secondary" onclick="cook(${p[0].id})">Start Cooking</button></div></div>`:""}`;
}
function openSwap(i){let list=filtered().map(r=>`<div class="card"><div class="row"><div><b>${r.name}</b><div class="meta">${r.time} min · ${r.cal} cal · ${r.p}g protein</div></div><button onclick="doSwap(${i},${r.id})">Choose</button></div></div>`).join("");swapList.innerHTML=list;swapDlg.showModal()}
function doSwap(i,id){state.plan[i]=recipes.find(r=>r.id===id);save();swapDlg.close();show("plan")}
function recipesView(){
 return `<div class="row"><h2>Recipes</h2><button onclick="generate()">Build Week</button></div>
 <div class="card"><input id="search" type="text" placeholder="Search recipes..." oninput="renderRecipes()"></div><div id="recipeList"></div>`;
}
function renderRecipes(){
 let q=(document.getElementById("search")?.value||"").toLowerCase();
 let list=recipes.filter(r=>r.name.toLowerCase().includes(q)||r.cuisine.toLowerCase().includes(q));
 document.getElementById("recipeList").innerHTML=list.map(r=>`<div class="card recipe"><div class="row"><div><h3>${r.name}</h3><div class="meta">${r.time} min · ${r.cal} cal · ${r.p}g protein</div></div><button onclick="cook(${r.id})">Cook</button></div><div class="tags">${r.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div><div class="meta" style="margin-top:9px">${Object.entries(r.ingredients).map(([k,v])=>`${k.replaceAll("_"," ")}: ${v}`).join(" · ")}</div></div>`).join("");
}
function shopView(){
 let counts={}, pantry=state.pantry.map(x=>x.toLowerCase().replaceAll(" ","_"));
 for(const r of state.plan)for(const [k,v] of Object.entries(r.ingredients)){
  if(pantry.some(p=>k.includes(p)||p.includes(k)))continue;
  counts[k]=(counts[k]||[]).concat([v]);
 }
 return `<h2>Grocery List</h2><div class="card notice">Built from your weekly plan. Pantry matches are excluded from the list.</div>
 <div class="card">${Object.keys(counts).length?Object.entries(counts).map(([k,vs])=>`<div class="listitem"><input type="checkbox" onchange="this.parentElement.style.textDecoration=this.checked?'line-through':''"><span><b>${k.replaceAll("_"," ")}</b><br><small>${vs.join(" + ")} · ${state.settings.servings} servings</small></span></div>`).join(""):`<div class="empty">Generate a plan first.</div>`}</div>
 <div class="card"><div class="actions"><button onclick="alert('Target handoff is the next integration milestone. Your Target password will never be stored in MealPilot.')">Send to Target</button><button class="secondary" onclick="window.print()">Print / Save PDF</button></div></div>`;
}
function pantryView(){return `<h2>Pantry</h2><div class="card"><div class="row"><input id="pantryInput" type="text" placeholder="e.g. olive oil"><button onclick="addPantry()">Add</button></div></div><div class="card">${state.pantry.length?state.pantry.map((x,i)=>`<div class="listitem"><span>${x}</span><button class="secondary" onclick="state.pantry.splice(${i},1);save();show('pantry')">Remove</button></div>`).join(""):`<div class="empty">Nothing in your pantry yet.</div>`}</div>`}
function addPantry(){let x=document.getElementById("pantryInput").value.trim();if(x){state.pantry.push(x);save();show("pantry")}}
function profileView(){let s=state.settings;return `<h2>Preferences</h2><div class="card">
<label>Diet</label><select id="diet"><option value="standard">Standard</option><option value="high-protein">High protein</option><option value="vegetarian">Vegetarian</option><option value="vegan">Vegan</option><option value="pescatarian">Pescatarian</option></select>
<label>Maximum cooking time</label><select id="maxTime"><option>20</option><option>30</option><option>45</option></select>
<label>Meals per week</label><select id="meals"><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select>
<label>Minimum protein per meal (g)</label><input id="minProtein" type="number" min="0" step="5" value="${s.minProtein}">
<label>Maximum calories per meal (0 = no limit)</label><input id="calMax" type="number" min="0" step="25" value="${s.calMax||0}">
<label>Servings</label><select id="servings"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
<label>Preferred cuisines (comma separated)</label><input id="cuisines" type="text" placeholder="Mexican, Italian" value="${s.cuisines||""}">
<label>Disliked ingredients (comma separated)</label><input id="dislikes" type="text" placeholder="mushrooms, onions" value="${s.dislikes||""}">
<label>Allergies (comma separated)</label><input id="allergies" type="text" placeholder="peanuts, shellfish" value="${s.allergies||""}">
<br><br><button onclick="savePrefs()">Save Preferences & Generate</button></div>`}
function savePrefs(){
 state.settings={diet:diet.value,maxTime:+maxTime.value,meals:+meals.value,minProtein:+minProtein.value,servings:+servings.value,calMax:+calMax.value,cuisines:cuisines.value,dislikes:dislikes.value,allergies:allergies.value};
 save();generate()
}
function cook(id){let r=recipes.find(x=>x.id===id),steps=["Gather and prep all ingredients.","Season the main protein and prepare the vegetables.","Cook the protein until done.","Cook or roast the vegetables and starch.","Combine and finish with the sauce or seasoning.","Plate and serve."];let i=0;let d=document.createElement("dialog");d.innerHTML=`<div class="modal"><h2>${r.name}</h2><div class="meta">${r.time} min · ${r.cal} cal · ${r.p}g protein</div><br><div class="progress"><div id="bar" style="width:17%"></div></div><p id="step" style="font-size:22px;line-height:1.4;margin:30px 0">${steps[0]}</p><div class="row"><button class="secondary" id="back">Back</button><button id="next">Next</button></div></div>`;document.body.appendChild(d);d.showModal();function upd(){step.textContent=steps[i];bar.style.width=((i+1)/steps.length*100)+"%";back.disabled=i===0;next.textContent=i===steps.length-1?"Done":"Next"}back.onclick=()=>{if(i>0){i--;upd()}};next.onclick=()=>{if(i<steps.length-1){i++;upd()}else d.close()};d.addEventListener("close",()=>d.remove());}
function show(page){document.querySelectorAll("nav button").forEach(b=>b.classList.remove("navactive"));document.getElementById("n"+page).classList.add("navactive");let el=document.getElementById("app");el.innerHTML=page==="plan"?planView():page==="recipes"?recipesView():page==="shop"?shopView():page==="pantry"?pantryView():profileView();
if(page==="recipes")renderRecipes();
if(page==="profile"){diet.value=state.settings.diet;maxTime.value=state.settings.maxTime;meals.value=state.settings.meals;servings.value=state.settings.servings}
}
show("plan");
</script>
</body></html>

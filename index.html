<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>MealPilot</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#171717;--muted:#707070;--line:#e7e7e4;--accent:#171717;--good:#2f7d4a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
button,input,select{font:inherit} button{border:0;cursor:pointer}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:88px}
header{position:sticky;top:0;z-index:5;background:rgba(247,247,245,.92);backdrop-filter:blur(16px);padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.brand{font-size:24px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:3px}
main{padding:16px}.view{display:none}.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:19px;font-weight:750}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.meal{padding:13px;border:1px solid var(--line);border-radius:15px;background:#fff}.meal h3{margin:0 0 6px;font-size:16px}.meal p{margin:3px 0;color:var(--muted);font-size:13px}
.primary{background:#111;color:#fff;padding:12px 15px;border-radius:12px;font-weight:700}.secondary{background:#eee;padding:10px 13px;border-radius:11px}.danger{color:#b33;background:#fff0f0}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:7px 10px;margin:3px;font-size:13px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
label{display:block;font-weight:650;margin:13px 0 6px}
.check{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.check input{width:auto}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}.nav{width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;padding:11px 4px;color:#777;font-size:11px}.nav button.active{color:#111;font-weight:800}.ico{display:block;font-size:20px;margin-bottom:2px}
.hero{background:#111;color:#fff;border-radius:22px;padding:20px;margin-bottom:14px}.hero .muted{color:#c9c9c9}
.stat{font-size:28px;font-weight:800}.recipe-img{height:130px;border-radius:14px;background:linear-gradient(135deg,#e9e5dc,#cfc8bb);display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:12px}
.big{font-size:25px;font-weight:800}.step{font-size:20px;line-height:1.45;padding:20px 4px}.progress{height:6px;background:#e5e5e5;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#111}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto;width:min(720px,100%);margin:auto}
@media(min-width:600px){.app{padding-left:8px;padding-right:8px}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">MealPilot</div><div class="sub">Plan • Shop • Cook</div></header>
<main>
<section id="plan" class="view active"></section>
<section id="recipes" class="view"></section>
<section id="shop" class="view"></section>
<section id="pantry" class="view"></section>
<section id="profile" class="view"></section>
</main>
<div class="bottom"><nav class="nav">
<button data-v="plan" class="active"><span class="ico">📅</span>Plan</button>
<button data-v="recipes"><span class="ico">🍳</span>Recipes</button>
<button data-v="shop"><span class="ico">🛒</span>Shop</button>
<button data-v="pantry"><span class="ico">🥫</span>Pantry</button>
<button data-v="profile"><span class="ico">⚙️</span>Profile</button>
</nav></div>
</div>

<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const recipes=[
{id:1,name:"Garlic Chicken & Roasted Broccoli",time:30,cal:520,p:48,c:24,f:24,cuisine:"American",tags:["high-protein"],emoji:"🍗",ings:[["chicken breast","1.5 lb","meat"],["broccoli","2 heads","produce"],["olive oil","2 tbsp","pantry"],["garlic","4 cloves","produce"],["lemon","1","produce"],["salt","1 tsp","pantry"]],steps:["Heat oven to 425°F.","Toss broccoli with olive oil, garlic and salt. Roast 18–20 minutes.","Season chicken, sear in a hot skillet until browned, then cook through.","Finish chicken with lemon juice. Serve with roasted broccoli."]},
{id:2,name:"Turkey Taco Bowls",time:25,cal:560,p:42,c:52,f:20,cuisine:"Mexican",tags:["high-protein"],emoji:"🌮",ings:[["ground turkey","1.25 lb","meat"],["black beans","1 can","canned"],["rice","1 cup","pantry"],["bell pepper","2","produce"],["salsa","1 cup","condiments"],["avocado","2","produce"]],steps:["Cook rice according to package directions.","Brown turkey with taco seasoning until cooked through.","Sauté sliced peppers until tender.","Build bowls with rice, turkey, beans, peppers, salsa and avocado."]},
{id:3,name:"Creamy Tuscan Chicken",time:30,cal:610,p:49,c:18,f:37,cuisine:"Italian",tags:["high-protein"],emoji:"🍝",ings:[["chicken breast","1.5 lb","meat"],["baby spinach","5 oz","produce"],["cherry tomatoes","1 pint","produce"],["heavy cream","1 cup","dairy"],["parmesan","1/2 cup","dairy"],["garlic","3 cloves","produce"]],steps:["Season chicken and sear in a skillet until golden and cooked through.","Remove chicken. Sauté garlic and tomatoes.","Add cream and parmesan; simmer until slightly thickened.","Fold in spinach. Return chicken and spoon sauce over the top."]},
{id:4,name:"Honey-Soy Salmon & Green Beans",time:25,cal:540,p:40,c:31,f:28,cuisine:"Asian-inspired",tags:["high-protein"],emoji:"🐟",ings:[["salmon fillets","4","seafood"],["green beans","1 lb","produce"],["soy sauce","3 tbsp","condiments"],["honey","2 tbsp","condiments"],["rice","1 cup","pantry"],["garlic","2 cloves","produce"]],steps:["Cook rice according to package directions.","Mix soy sauce, honey and garlic.","Sear salmon and brush with sauce; cook until flaky.","Steam or sauté green beans. Serve with rice."]},
{id:5,name:"Chicken Fajita Sheet Pan",time:30,cal:500,p:45,c:35,f:18,cuisine:"Mexican",tags:["high-protein"],emoji:"🌯",ings:[["chicken breast","1.5 lb","meat"],["bell pepper","3","produce"],["onion","1 large","produce"],["tortillas","8","bakery"],["lime","2","produce"],["fajita seasoning","2 tbsp","spices"]],steps:["Heat oven to 425°F.","Slice chicken, peppers and onion; toss with seasoning and oil.","Roast 20–25 minutes, stirring once.","Finish with lime and serve in warm tortillas."]},
{id:6,name:"Greek Chicken Pitas",time:20,cal:470,p:39,c:42,f:16,cuisine:"Greek",tags:["high-protein","quick"],emoji:"🥙",ings:[["chicken breast","1.25 lb","meat"],["pita bread","6","bakery"],["cucumber","1","produce"],["tomatoes","2","produce"],["Greek yogurt","1 cup","dairy"],["feta","4 oz","dairy"]],steps:["Season and cook chicken in a skillet; slice.","Chop cucumber and tomatoes.","Mix yogurt with lemon, garlic and salt for a quick sauce.","Fill pitas with chicken, vegetables, feta and sauce."]}
];
let state=JSON.parse(localStorage.mealpilot||'null')||{
plan:[1,2,3,4,5], servings:2, diet:"Any", maxTime:30, favorites:[1,3], pantry:["olive oil","salt"], done:[], cart:[], search:""
};
function save(){localStorage.mealpilot=JSON.stringify(state)}
function r(id){return recipes.find(x=>x.id==id)}
function renderPlan(){
 const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
 let html=`<div class="hero"><div class="muted">THIS WEEK</div><div class="big">Your meal plan</div><p class="muted">Built around your preferences, ingredient overlap and time.</p><button class="primary" onclick="autoPlan()">✨ Build a new plan</button></div>
 <div class="card"><div class="row"><div><div class="title">5 dinners</div><div class="muted">${state.servings} servings • ≤ ${state.maxTime} min</div></div><span class="chip">Waste-aware</span></div></div>`;
 state.plan.forEach((id,i)=>{let x=r(id);html+=`<div class="card"><div class="row"><div><div class="muted">${days[i]||"Extra"}</div><div class="title">${x.emoji} ${x.name}</div><p class="muted">${x.time} min • ${x.cal} cal • ${x.p}g protein</p></div><button class="secondary" onclick="swap(${i})">Swap</button></div></div>`});
 document.getElementById("plan").innerHTML=html;
}
function autoPlan(){
 let pool=recipes.filter(x=>x.time<=state.maxTime && (state.diet=="Any"||state.diet=="High protein"&&x.tags.includes("high-protein")));
 pool=pool.sort(()=>Math.random()-.5);
 state.plan=pool.slice(0,Math.min(5,pool.length)).map(x=>x.id); rebuildCart();save();renderPlan();renderShop();
}
function swap(i){let current=state.plan[i];let candidates=recipes.filter(x=>x.id!==current&&x.time<=state.maxTime);state.plan[i]=candidates[Math.floor(Math.random()*candidates.length)].id;rebuildCart();save();renderPlan();renderShop()}
function rebuildCart(){
 const map={}; state.plan.forEach(id=>r(id).ings.forEach(([name,q,cat])=>{let key=name.toLowerCase(); if(!map[key])map[key]={name,q,cat,recipes:[]}; map[key].recipes.push(r(id).name)}));
 state.cart=Object.values(map).map(x=>({...x,checked:false})); save();
}
function renderRecipes(){
 let q=state.search.toLowerCase();
 let list=recipes.filter(x=>!q||x.name.toLowerCase().includes(q)||x.cuisine.toLowerCase().includes(q));
 document.getElementById("recipes").innerHTML=`<div class="row"><div><div class="title">Recipes</div><div class="muted">Original starter library</div></div></div>
 <div class="card"><input placeholder="Search recipes or cuisine" value="${state.search}" oninput="state.search=this.value;renderRecipes()"></div>
 <div class="grid">${list.map(x=>`<div class="meal" onclick="showRecipe(${x.id})"><div class="recipe-img">${x.emoji}</div><h3>${x.name}</h3><p>${x.time} min • ${x.cal} cal</p><p>${x.p}g protein</p></div>`).join("")}</div>`;
}
function showRecipe(id){
 let x=r(id),fav=state.favorites.includes(id);
 document.getElementById("sheet").innerHTML=`<div class="row"><div class="title">${x.emoji} ${x.name}</div><button class="secondary" onclick="closeModal()">✕</button></div>
 <p class="muted">${x.time} min • ${x.cal} calories • ${x.p}g protein • ${x.cuisine}</p>
 <button class="${fav?'secondary':'primary'}" onclick="toggleFav(${id})">${fav?'♥ Favorited':'♡ Favorite'}</button>
 <h3>Ingredients</h3>${x.ings.map(i=>`<div class="check"><span>${i[1]} ${i[0]}</span><small class="muted">${i[2]}</small></div>`).join("")}
 <h3>Instructions</h3>${x.steps.map((s,i)=>`<div class="check"><b>${i+1}.</b><span>${s}</span></div>`).join("")}
 <button class="primary" style="width:100%;margin-top:12px" onclick="cook(${id})">👨‍🍳 Cook this</button>`;
 document.getElementById("modal").style.display="flex";
}
function toggleFav(id){if(state.favorites.includes(id))state.favorites=state.favorites.filter(x=>x!==id);else state.favorites.push(id);save();showRecipe(id);renderRecipes()}
function cook(id){let x=r(id);document.getElementById("sheet").innerHTML=`<div class="row"><div><div class="muted">COOKING MODE</div><div class="title">${x.emoji} ${x.name}</div></div><button class="secondary" onclick="closeModal()">✕</button></div><div id="cookstep"></div>`;let n=0;function draw(){document.getElementById("cookstep").innerHTML=`<div class="progress"><div style="width:${(n/x.steps.length)*100}%"></div></div><div class="muted" style="margin-top:12px">Step ${n+1} of ${x.steps.length}</div><div class="step">${x.steps[n]}</div><div class="row"><button class="secondary" onclick="${n>0?'n--;draw()':''}">Back</button><button class="primary" onclick="${n<x.steps.length-1?'n++;draw()':'finishCook('+id+')'}">${n<x.steps.length-1?'Next':'Done'}</button></div>`}draw()}
function finishCook(id){state.done.push(id);save();closeModal();renderPlan()}
function renderShop(){
 let groups={};state.cart.forEach((x,i)=>(groups[x.cat]??=[]).push({...x,i}));
 let body=Object.entries(groups).map(([cat,items])=>`<div class="card"><div class="title">${cat[0].toUpperCase()+cat.slice(1)}</div>${items.map(x=>`<div class="check"><input type="checkbox" ${x.checked?'checked':''} onchange="state.cart[${x.i}].checked=this.checked;save();renderShop()"><span style="flex:1;${x.checked?'text-decoration:line-through;color:#999':''}">${x.q} ${x.name}<small class="muted" style="display:block">${x.recipes.join(", ")}</small></span></div>`).join("")}</div>`).join("");
 document.getElementById("shop").innerHTML=`<div class="row"><div><div class="title">Grocery list</div><div class="muted">${state.cart.filter(x=>!x.checked).length} items remaining</div></div><button class="secondary" onclick="rebuildCart();renderShop()">Refresh</button></div>
 <div class="hero" style="margin-top:12px"><div class="big">Shop smarter</div><p class="muted">Your ingredients are combined across the week's recipes.</p><button class="primary" onclick="target()">🛒 Send to Target</button></div>${body}`;
}
function target(){alert("Target connection is the next integration milestone. The current app creates the exact grocery basket that will be passed to the authorized Target shopping flow; no Target password is stored here.")}
function renderPantry(){document.getElementById("pantry").innerHTML=`<div class="title">Pantry & fridge</div><p class="muted">Tell the planner what you already have so it can reduce duplicate purchases.</p><div class="card"><input id="newPantry" placeholder="Add an item, e.g. eggs"><button class="primary" style="width:100%;margin-top:10px" onclick="addPantry()">Add item</button></div><div class="card">${state.pantry.map((x,i)=>`<div class="check"><span>${x}</span><button class="secondary" onclick="state.pantry.splice(${i},1);save();renderPantry()">Remove</button></div>`).join("")||'<div class="muted">Nothing added yet.</div>'}</div>`}
function addPantry(){let x=document.getElementById("newPantry").value.trim();if(x){state.pantry.push(x);save();renderPantry()}}
function renderProfile(){document.getElementById("profile").innerHTML=`<div class="title">Preferences</div><p class="muted">These control the planner.</p><div class="card"><label>Servings</label><select onchange="state.servings=+this.value;save();renderProfile()">${[1,2,3,4,5,6].map(n=>`<option ${state.servings==n?'selected':''}>${n}</option>`).join("")}</select>
<label>Diet</label><select onchange="state.diet=this.value;save()"><option>Any</option><option ${state.diet=="High protein"?"selected":""}>High protein</option></select>
<label>Maximum cooking time</label><select onchange="state.maxTime=+this.value;save()"><option ${state.maxTime==20?"selected":""}>20</option><option ${state.maxTime==30?"selected":""}>30</option><option ${state.maxTime==45?"selected":""}>45</option></select></div>
<div class="card"><div class="title">Favorites</div><p class="muted">${state.favorites.length} saved recipes</p></div>
<div class="card"><div class="title">Target</div><p class="muted">Shopping integration placeholder. We'll connect the authorized Target experience once the basket engine is proven.</p></div>`}
function closeModal(){document.getElementById("modal").style.display="none"}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.v).classList.add("active");if(b.dataset.v=="plan")renderPlan();if(b.dataset.v=="recipes")renderRecipes();if(b.dataset.v=="shop")renderShop();if(b.dataset.v=="pantry")renderPantry();if(b.dataset.v=="profile")renderProfile()});
rebuildCart();renderPlan();
</script>
</body></html>

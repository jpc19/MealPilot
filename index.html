<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#171717;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--green:#15803d}

header{padding:18px 18px 8px;position:sticky;top:0;background:rgba(245,245,247,.94);backdrop-filter:blur(12px);z-index:5}

main{padding:10px 16px;max-width:760px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #00000008}
button,select,input{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;font-weight:650;background:#111827;color:white}
button.secondary{background:#eef0f3;color:#111827}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap}
.recipe h3{margin:0 0 4px}.meta{color:var(--muted);font-size:13px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{font-size:11px;padding:5px 8px;background:#f0f1f3;border-radius:99px}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#111827}

nav button{background:transparent;color:#6b7280;padding:7px 8px;font-size:11px}.navactive{color:#111827!important}
.meal{display:flex;justify-content:space-between;gap:10px;align-items:center}.meal strong{display:block}.meal small{color:var(--muted)}
input[type=checkbox]{width:20px;height:20px}.listitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
dialog{border:0;border-radius:20px;width:min(92%,560px);padding:0;box-shadow:0 20px 70px #0005}dialog::backdrop{background:#0008}.modal{padding:20px}
select,input[type=number],input[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:white}

</style>
<style>

<style id="mealpilot-v12-design">
:root{

  border-radius:14px!important;

h1,h2,h3{letter-spacing:-.025em}

.card,.recipe-card,.meal-card,.grocery-card,.panel,.section,.item-card{

  padding:10px 12px!important;
}
button.primary,.primary,.btn-primary{

  box-shadow:0 5px 14px rgba(22,163,106,.22)!important;

button.secondary,.secondary{
  background:#fff!important;
  color:var(--mp-text)!important;

}
.badge,.pill,.tag{
  border-radius:999px!important;
  background:var(--mp-accent-soft)!important;
  color:var(--mp-accent-dark)!important;
  padding:5px 9px!important;
  font-weight:650;
}
nav, .nav, .bottom-nav, .tabs{
  background:rgba(255,255,255,.94)!important;
  border-top:1px solid var(--mp-line)!important;

  backdrop-filter:blur(18px);
}
nav button,.nav button,.bottom-nav button,.tabs button{

  box-shadow:none!important;

}
nav button.active,.nav button.active,.bottom-nav button.active,.tabs button.active{
  color:var(--mp-accent)!important;
  font-weight:750!important;
}
hr{border-color:var(--mp-line)!important}
small,.muted,.secondary-text{color:var(--mp-muted)!important}

/* Make the weekly plan feel like a dashboard */
[data-day],.day-card{
  background:#fff!important;
  border:1px solid var(--mp-line)!important;
  border-radius:18px!important;
  box-shadow:0 5px 18px rgba(20,30,40,.05)!important;
  padding:14px!important;
  margin-bottom:12px!important;
}
.cooked,.is-cooked{
  background:var(--mp-accent-soft)!important;
  border-color:#bfe8d3!important;
}

/* Touch targets */
button{min-height:42px}
a{color:var(--mp-accent-dark)}

/* Safe-area friendly mobile layout */
body{
  padding-bottom:max(76px, env(safe-area-inset-bottom))!important;
}
</style>

let state=JSON.parse(localStorage.getItem("mealpilot100")||localStorage.getItem("mealpilot82")||"null")||{plan:[],pantry:[],favorites:[],customGroceries:[],cookedHistory:[],settings:{diet:"standard",maxTime:30,meals:5,minProtein:0,servings:2,calMax:0,cuisines:"",dislikes:"",allergies:""}};
function save(){state.customGroceries??=[];state.cookedHistory??=[];state.cookedPlan??={};localStorage.setItem("mealpilot100",JSON.stringify(state))}
function filtered(){
 let s=state.settings, dislikes=(s.dislikes||"").toLowerCase().split(",").map(x=>x.trim()).filter(Boolean), allergies=(s.allergies||"").toLowerCase().split(",").map(x=>x.trim()).filter(Boolean), cuisines=(s.cuisines||"").toLowerCase().split(",").map(x=>x.trim()).filter(Boolean);
 return recipes.filter(r=>{
  if(s.diet!=="standard"&&!r.diets.includes(s.diet))return false;
  if(r.time>s.maxTime||r.p<s.minProtein)return false;
  if(s.calMax>0&&r.cal>s.calMax)return false;
  if(cuisines.length&&!cuisines.includes(r.cuisine.toLowerCase()))return false;
  let ing=Object.keys(r.ingredients).join(" ").toLowerCase(), name=r.name.toLowerCase();
  if(dislikes.some(x=>ing.includes(x)||name.includes(x)))return false;
  if(allergies.some(x=>ing.includes(x)||name.includes(x)))return false;
  return true;
 })
}
function generate(){
 let pool=filtered();if(pool.length<state.settings.meals){alert("Not enough recipes match your filters. Try relaxing one preference.");return}
 let used=new Set(),out=[],recent=state.plan.map(x=>x.id),pantry=new Set(state.pantry.map(x=>x.toLowerCase().replaceAll(" ","_")));
 for(let i=0;i<state.settings.meals;i++){
  let selected=new Set(out.flatMap(r=>Object.keys(r.ingredients)));
  let candidates=pool.filter(r=>!used.has(r.id));
  candidates.sort((a,b)=>scorePlan(b,selected,pantry,recent)-scorePlan(a,selected,pantry,recent));
  let top=candidates.slice(0,Math.min(5,candidates.length));
  let pick=top[Math.floor(Math.random()*top.length)];used.add(pick.id);out.push(pick);
 }
 state.plan=out;state.customGroceries??=[];save();show("plan")
}
function scorePlan(r,selected,pantry,recent){
 return Object.keys(r.ingredients).filter(x=>selected.has(x)).length*5+
        Object.keys(r.ingredients).filter(x=>pantry.has(x)).length*3+
        (recent.includes(r.id)?-6:0)+(r.p>=state.settings.minProtein?2:0)
}
function score(r,ing){return Object.keys(r.ingredients).filter(x=>ing.has(x)).length}
function planView(){
 let p=state.plan;state.cookedPlan??={};
 const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
 return `<h2>This Week</h2>
 <div class="card"><div class="row"><div><b>${p.length||0} meals planned</b><div class="meta">${state.settings.servings} servings each</div></div><div class="actions"><button onclick="generate()">Generate My Week</button>${p.length?`<button class="secondary" onclick="clearPlan()">Clear</button>`:""}</div></div>${p.length?`<div class="meta" style="margin-top:12px">Average: ${Math.round(p.reduce((a,r)=>a+r.cal,0)/p.length)} cal · ${Math.round(p.reduce((a,r)=>a+r.p,0)/p.length)}g protein</div>`:""}</div>
 ${p.length?p.map((r,i)=>{let cooked=!!state.cookedPlan[i];return `<div class="card meal"><div style="flex:1"><small>${days[i]}</small><strong>${r.name}</strong><small>${r.time} min · ${r.cal} cal · ${r.p}g protein</small>${cooked?`<span class="tag" style="margin-top:6px;display:inline-block">✓ Cooked</span>`:""}</div><div class="actions"><button onclick="cook(${r.id},${i})">${cooked?'Cook Again':'Cook'}</button><button class="secondary" onclick="markPlanCooked(${i})">${cooked?'Unmark Cooked':'I Cooked This'}</button><button class="secondary" onclick="openSwap(${i})">Swap</button></div></div>`}).join(""):`<div class="card empty">No plan yet.<br>Tap <b>Generate My Week</b> to build one.</div>`}
 ${p.length?`<div class="card"><div class="actions"><button onclick="show('shop')">View Grocery List</button></div></div>`:""}`;
}
function markPlanCooked(i){state.cookedPlan??={};if(state.cookedPlan[i])delete state.cookedPlan[i];else state.cookedPlan[i]={id:state.plan[i].id,name:state.plan[i].name,date:new Date().toISOString()};save();show('plan');toast(state.cookedPlan[i]?'Marked cooked':'Marked not cooked')}

function renderRecipes(){
 let q=(document.getElementById("search")?.value||"").toLowerCase();
 let list=recipes.filter(r=>r.name.toLowerCase().includes(q)||r.cuisine.toLowerCase().includes(q));
 if(recipeFilter==='favorites')list=list.filter(r=>(state.favorites||[]).includes(r.id));
 if(recipeFilter==='quick')list=list.filter(r=>r.time<=30);
 document.getElementById("recipeList").innerHTML=list.length?list.map(r=>{let fav=(state.favorites||[]).includes(r.id);return `<div class="card recipe recipeTap" onclick="recipeDetail(${r.id})"><div class="row"><div><h3>${r.name}</h3><div class="meta">${r.time} min · ${r.cal} cal · ${r.p}g protein</div></div><div class="actions"><button class="fav ${fav?'on':''}" onclick="event.stopPropagation();toggleFavorite(${r.id})">${fav?'★':'☆'}</button><button onclick="event.stopPropagation();cook(${r.id})">Cook</button></div></div><div class="tags">${r.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div></div>`}).join(""):`<div class="card empty">No recipes match your filters.</div>`;
}

<script>
/* MealPilot v1.0.1 cooking-selection fix */
(function(){
  const KEY = 'mealpilot_selected_recipe_v101';
  const COOKED = 'mealpilot_cooked_v101';

  function selectedId(){
    return localStorage.getItem(KEY);
  }

  function setSelected(id){
    if(id == null || id === '') return;
    localStorage.setItem(KEY, String(id));
  }

  function cookedMap(){
    try { return JSON.parse(localStorage.getItem(COOKED) || '{}'); }
    catch(e){ return {}; }
  }

  function saveCooked(m){
    localStorage.setItem(COOKED, JSON.stringify(m));
  }

  // Intercept clicks on common meal/recipe action buttons.
  document.addEventListener('click', function(e){
    const el = e.target.closest('button,[data-recipe-id],[data-id]');
    if(!el) return;

    const rid = el.getAttribute('data-recipe-id') || el.getAttribute('data-id');
    if(rid){
      setSelected(rid);
    }

    const txt = (el.textContent || '').trim().toLowerCase();

    // If the button is a Cook action, make the selected recipe explicit.
    if(rid && (txt === 'cook' || txt.includes('cook this') || txt.includes('start cooking'))){
      setTimeout(function(){
        // Give the existing app handler time to run, then re-render if available.
        if(typeof window.render === 'function') window.render();
      }, 0);
    }
  }, true);

  // Expose helpers so the existing app can use the exact selected recipe.
  window.MealPilotCookingFix = {
    select: setSelected,
    getSelected: selectedId,
    markCooked: function(id){
      id = id || selectedId();
      if(!id) return;
      const m = cookedMap();
      m[String(id)] = { cookedAt: new Date().toISOString() };
      saveCooked(m);
    },
    isCooked: function(id){
      return !!cookedMap()[String(id)];
    }
  };

  // Patch likely global cooking functions if present.
  function patchFunction(name){
    const original = window[name];
    if(typeof original !== 'function' || original.__mp101) return;
    const wrapped = function(id){
      if(id != null) setSelected(id);
      else if(arguments.length === 0 && selectedId()) id = selectedId();
      return original.apply(this, arguments);
    };
    wrapped.__mp101 = true;
    window[name] = wrapped;
  }

  ['startCooking','cookRecipe','openCooking','startCook','openRecipeCooking'].forEach(patchFunction);

  // When a "Mark Cooked" control is clicked, persist the exact selected recipe.
  document.addEventListener('click', function(e){
    const el = e.target.closest('button');
    if(!el) return;
    const txt = (el.textContent || '').trim().toLowerCase();
    if(txt.includes('mark cooked') || txt === 'cooked' || txt.includes('finished cooking')){
      const id = el.getAttribute('data-recipe-id') || selectedId();
      if(id) window.MealPilotCookingFix.markCooked(id);
      setTimeout(function(){
        if(typeof window.render === 'function') window.render();
      }, 0);
    }
  }, true);

  // Prevent stale selection from silently forcing Monday's recipe:
  // if the app stores a current recipe variable, expose a getter for compatibility.
  Object.defineProperty(window, 'mealpilotSelectedRecipeId', {
    configurable: true,
    get: selectedId,
    set: setSelected
  });
})();
</script>

<script id="mealpilot-v151-safe">
(function(){
  "use strict";
  try {
    var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

    function allRecipes(){
      try {
        var r=window.recipes||window.RECIPES||window.recipeData||[];
        return Array.isArray(r)?r:[];
      } catch(e){ return []; }
    }

    function findRecipeByTitle(title){
      var a=allRecipes();
      for(var i=0;i<a.length;i++){
        var n=a[i] && (a[i].name||a[i].title);
        if(n===title) return a[i];
      }
      return null;
    }

    function detectPlan(){
      var keys=["mealpilot_plan","plan","weeklyPlan"];
      for(var i=0;i<keys.length;i++){
        try{
          var raw=localStorage.getItem(keys[i]);
          if(!raw) continue;
          var value=JSON.parse(raw);
          if(value && (Array.isArray(value)||typeof value==="object"))
            return {key:keys[i],value:value};
        }catch(e){}
      }
      return null;
    }

    function addToDay(recipeId,dayIndex){
      var found=detectPlan(), day=DAYS[dayIndex];
      if(found){
        if(Array.isArray(found.value)) found.value[dayIndex]=recipeId;
        else found.value[day]=recipeId;
        try{localStorage.setItem(found.key,JSON.stringify(found.value));}catch(e){}
      }
      try{
        localStorage.setItem("mealpilot_selected_day_v151",day);
        localStorage.setItem("mealpilot_selected_recipe_v151",String(recipeId));
      }catch(e){}
      try{ if(typeof window.render==="function") window.render(); }catch(e){}
    }

    function picker(recipe){
      if(!recipe) return;
      var id=recipe.id||recipe.name||recipe.title;
      var modal=document.createElement("div");
      modal.className="mp15-modal";
      var buttons="";
      for(var i=0;i<DAYS.length;i++){
        buttons+='<button class="mp15-day" data-day="'+i+'"><b>'+DAYS[i]+'</b><span>Add meal here</span></button>';
      }
      modal.innerHTML='<div class="mp15-picker"><h2>Add to your week</h2><p>Choose a day for '+String(recipe.name||recipe.title||"this recipe")+'.</p><div class="mp15-days">'+buttons+'</div><button class="mp15-cancel">Cancel</button></div>';
      document.body.appendChild(modal);
      modal.querySelector(".mp15-cancel").onclick=function(){modal.remove();};
      var dayButtons=modal.querySelectorAll(".mp15-day");
      for(var j=0;j<dayButtons.length;j++){
        dayButtons[j].onclick=function(){
          addToDay(id,Number(this.getAttribute("data-day")));
          modal.remove();
        };
      }
    }

    document.addEventListener("click",function(e){
      try{
        var btn=e.target && e.target.closest ? e.target.closest("#mp14-add") : null;
        if(!btn) return;
        var overlay=document.getElementById("mp14-overlay");
        var title=overlay && overlay.querySelector(".mp14-title");
        var recipe=findRecipeByTitle(title ? title.textContent : "");
        if(!recipe) return; // Let the original handler run if we cannot safely identify it.
        e.preventDefault();
        e.stopImmediatePropagation();
        picker(recipe);
      }catch(err){}
    },true);

    setTimeout(function(){
      try{
        var d=document.getElementById("mp13-discover");
        if(d){
          var hero=d.querySelector(".mp13-hero");
          if(hero) hero.classList.add("mp15-hero");
        }
      }catch(e){}
    },600);
  } catch(e) {
    // Never allow enhancement code to break the base MealPilot app.
  }
})();
</script>
